name: Bump

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Chap release version (without the leading v)
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - id: target
        name: Resolve target version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version=$REQUESTED_VERSION
          if [[ -z "$version" ]]; then
            version=$(scripts/latest-version.sh)
          fi
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/chap.rb)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == "$current" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "chap $version is already current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The tap pulls from chap's public releases, so no cross-repository credential exists.
      - name: Bump formula
        if: steps.target.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: scripts/bump.sh "$VERSION"
      - name: Commit formula
        if: steps.target.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/chap.rb
          git commit -m "chap $VERSION"
      # Installing before pushing keeps a broken formula from ever landing on main.
      - name: Tap checkout
        if: steps.target.outputs.changed == 'true'
        run: brew tap luizribeiro/chap "$PWD"
      - name: Install formula
        if: steps.target.outputs.changed == 'true'
        run: brew install luizribeiro/chap/chap
      - name: Test formula
        if: steps.target.outputs.changed == 'true'
        run: brew test luizribeiro/chap/chap
      - name: Push update
        if: steps.target.outputs.changed == 'true'
        run: git push
